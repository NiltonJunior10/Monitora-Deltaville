<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 430" role="img" aria-labelledby="t d">
<title id="t">Entrada do Deltaville</title>
<desc id="d">Ilustração vetorial flat da entrada do bairro Deltaville com três arcos, avenida curva, casas, palmeiras e vegetação.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#EAF9FF"/>
    <stop offset="42%" stop-color="#CFF3FD"/>
    <stop offset="72%" stop-color="#DDF7F8"/>
    <stop offset="100%" stop-color="#F8FCFF"/>
  </linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="0.15" y2="1">
    <stop offset="0%" stop-color="#8CC9E8"/>
    <stop offset="100%" stop-color="#B9DFF3"/>
  </linearGradient>
</defs>

<!-- fundo em degradê -->
<rect width="220" height="430" fill="url(#sky)"/>

<!-- nuvens -->
<g fill="#EEF9FD" opacity=".96">
