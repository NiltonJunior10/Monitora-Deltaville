<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 360" role="img" aria-labelledby="t d">
<title id="t">Entrada do Deltaville</title>
<desc id="d">Ilustração vetorial flat da entrada do bairro Deltaville com os três arcos, casas, palmeiras e avenida.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#EAF8FF"/>
    <stop offset=".46" stop-color="#C9F1FB"/>
    <stop offset="1" stop-color="#EAFBFC"/>
  </linearGradient>
  <linearGradient id="road" x1=".5" y1="0" x2=".5" y2="1">
    <stop offset="0" stop-color="#8ECBEA"/>
    <stop offset="1" stop-color="#B8DEF3"/>
  </linearGradient>
</defs>
<rect width="220" height="360" fill="url(#sky)"/>
<path d="M0 116c28-18 47-16 69 2 18-19 39-21 62-5 26-23 54-23 89 2v70H0z" fill="#D8F3FA"/>
<path d="M0 151c34-25 65-24 94 1 34-33 77-32 126 4v62H0z" fill="#B7E5EE"/>
<path d="M0 171c26-21 54-20 83 1 31-26 72-27 137 4v45H0z" fill="#8FD4DE"/>

<!-- casas -->
