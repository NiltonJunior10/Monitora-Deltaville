name: Export Monitora source files

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export source files
        uses: actions/upload-artifact@v4
        with:
          name: monitora-html-css-js
          path: |
            public/index.html
            public/v6.css
            public/app.js
          if-no-files-found: error
          retention-days: 1
